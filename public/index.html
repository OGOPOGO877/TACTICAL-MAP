<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>TACTICAL MAP</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect fill='%230b0c0e' width='64' height='64'/><path fill='%23c9a227' d='M32 8 56 56H8z'/></svg>" />
  </head>
  <body>
    <div id="boot">
      <div class="boot-card">
        <div class="boot-mark">TM</div>
        <h1>TACTICAL MAP</h1>
        <p id="boot-text">LOADING...</p>
      </div>
    </div>

    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-mark">TM</span>
          <div>
            <strong>TACTICAL MAP</strong>
            <em>ESCAPE FROM TARKOV</em>
          </div>
        </div>

        <label class="map-select-wrap">
          <span>MAP</span>
          <select id="map-select"></select>
        </label>

        <div class="top-meta">
          <div class="users-count" title="Connected users">
            <span>SQUAD</span>
            <b id="users-top">0</b>
          </div>
          <div id="conn-status" data-status="DISCONNECTED">DISCONNECTED</div>
          <div id="room-label" hidden></div>
        </div>
      </header>

      <div id="workspace">
        <aside id="toolbar">
          <button data-tool="select" title="SELECT (V)" class="active">
            <svg viewBox="0 0 24 24"><path d="M4 3l12 9-5 1 3 8-3 1-3-8-4 4z"/></svg>
            <span>SELECT</span>
          </button>
          <button data-tool="pen" title="PEN (P)">
            <svg viewBox="0 0 24 24"><path d="M4 20l4.5-1.2L19 8.3 15.7 5 5.3 15.4z"/></svg>
            <span>PEN</span>
          </button>
          <button data-tool="arrow" title="ARROW (A)">
            <svg viewBox="0 0 24 24"><path d="M4 12h12l-4-4 1.4-1.4L20 12l-6.6 5.4L12 16l4-4H4z"/></svg>
            <span>ARROW</span>
          </button>
          <button data-tool="circle" title="CIRCLE (C)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>CIRCLE</span>
          </button>
          <button data-tool="pin" title="PIN (N)">
            <svg viewBox="0 0 24 24"><path d="M12 22s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12zm0-9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
            <span>PIN</span>
          </button>
          <button data-tool="text" title="TEXT (T)">
            <svg viewBox="0 0 24 24"><path d="M5 5h14v3h-5v11h-4V8H5z"/></svg>
            <span>TEXT</span>
          </button>
          <button data-tool="eraser" title="ERASER (E)">
            <svg viewBox="0 0 24 24"><path d="M16 3 4.5 14.5 9 19h6l5.5-5.5z"/></svg>
            <span>ERASER</span>
          </button>
          <button data-tool="ping" title="PING (G)">
            <svg viewBox="0 0 24 24"><path d="M12 12.8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 0c4-1 7-4 8.5-8M12 12.8c-4-1-7-4-8.5-8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span>PING</span>
          </button>
          <div class="tool-sep"></div>
          <button data-tool="undo" title="UNDO (Ctrl+Z)">
            <svg viewBox="0 0 24 24"><path d="M7 8H3v4m0-4c3-4 8-5 12-3s6 7 4 11-8 6-12 3"/></svg>
            <span>UNDO</span>
          </button>
          <button data-tool="redo" title="REDO (Ctrl+Y)">
            <svg viewBox="0 0 24 24"><path d="M17 8h4v4m0-4c-3-4-8-5-12-3s-6 7-4 11 8 6 12 3"/></svg>
            <span>REDO</span>
          </button>
          <button data-tool="clear" class="danger" title="CLEAR MAP">
            <svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2m-8 0 1 13h8l1-13"/></svg>
            <span>CLEAR</span>
          </button>
        </aside>

        <main id="map-wrap">
          <div id="pin-bar" hidden>
            <button data-pin="ENEMY" class="active">ENEMY</button>
            <button data-pin="TEAM">TEAM</button>
            <button data-pin="DANGER">DANGER</button>
            <button data-pin="LOOT">LOOT</button>
            <button data-pin="EXIT">EXIT</button>
            <button data-pin="MEET">MEET</button>
            <button data-pin="SNIPER">SNIPER</button>
          </div>
          <div id="stage"></div>
          <input id="text-editor" maxlength="200" hidden placeholder="TEXT  ·  ENTER" />
          <div id="map-hud">
            <button id="btn-fit" type="button">FIT TO SCREEN</button>
            <button id="btn-reset" type="button">RESET VIEW</button>
            <span id="zoom-label">100%</span>
          </div>
        </main>
      </div>

      <footer id="users-bar"></footer>

      <div id="local-dev" hidden>
        <span>LOCAL DEV</span>
        <label>NAME <input id="local-name" maxlength="32" /></label>
        <label>ROOM <input id="local-room" maxlength="64" /></label>
        <label class="grow">JOIN URL <input id="local-url" readonly /></label>
        <button id="copy-url" type="button">COPY</button>
      </div>
    </div>

    <div id="modal" hidden>
      <div class="modal-card">
        <h2>CONFIRM CLEAR</h2>
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button id="modal-cancel" type="button">CANCEL</button>
          <button id="modal-ok" type="button" class="danger">CLEAR ALL</button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
